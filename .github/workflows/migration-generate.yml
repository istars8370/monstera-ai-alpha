name: One-time isolated Drizzle migration validation

on:
  push:
    branches: [integration/t1-t12]
    paths:
      - .github/workflows/migration-generate.yml

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: github.repository == 'istars8370/monstera-ai-alpha' && github.ref == 'refs/heads/integration/t1-t12'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integration_user
          POSTGRES_PASSWORD: ephemeral_only
          POSTGRES_DB: monstera_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration_user -d monstera_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://integration_user:ephemeral_only@127.0.0.1:5432/monstera_integration
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate migration from five-table schema
        run: pnpm exec drizzle-kit generate --config=drizzle.config.ts
      - name: Apply generated SQL to disposable PostgreSQL
        run: |
          set -eu
          for migration in db/migrations/*.sql; do
            docker run --rm -i --network host -e PGPASSWORD=ephemeral_only postgres:16 psql -h 127.0.0.1 -U integration_user -d monstera_integration -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Check table count, constraints and rollback
        run: |
          set -eu
          PSQL='docker run --rm --network host -e PGPASSWORD=ephemeral_only postgres:16 psql -h 127.0.0.1 -U integration_user -d monstera_integration -v ON_ERROR_STOP=1'
          test "$($PSQL -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'")" = '5'
          test "$($PSQL -tAc "SELECT COUNT(*) FROM pg_constraint WHERE conname = 'usage_ledger_settled_within_reserved'")" = '1'
          $PSQL -c "BEGIN; INSERT INTO users(email) VALUES ('rollback@example.invalid'); ROLLBACK;"
          test "$($PSQL -tAc "SELECT COUNT(*) FROM users WHERE email='rollback@example.invalid'")" = '0'
      - name: Recheck TypeScript
        run: pnpm typecheck
      - name: Recheck ESLint
        run: pnpm lint
      - name: Recheck build
        run: pnpm build
      - name: Commit generated migration only
        run: |
          git add -- db/migrations
          if git diff --cached --quiet; then
            echo 'Migration files already current.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(db): generate and validate five-table migration"
          git push origin HEAD:integration/t1-t12
