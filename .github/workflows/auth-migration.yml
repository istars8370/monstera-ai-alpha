name: One-time Google subject migration validation
on:
  push:
    branches: [integration/t1-t12]
    paths: [.github/workflows/auth-migration.yml]
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'istars8370/monstera-ai-alpha' && github.ref == 'refs/heads/integration/t1-t12'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migration_test
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_DB: auth_migration
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U migration_test -d auth_migration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate additive Drizzle migration
        run: pnpm exec drizzle-kit generate --config=drizzle.config.ts
      - name: Ensure migration is additive and table count remains five
        run: |
          set -eu
          for migration in db/migrations/*.sql; do
            docker run --rm -i --network host -e PGPASSWORD=disposable_only postgres:16 psql -h 127.0.0.1 -U migration_test -d auth_migration -v ON_ERROR_STOP=1 < "$migration"
          done
          docker run --rm -i --network host -e PGPASSWORD=disposable_only postgres:16 psql -h 127.0.0.1 -U migration_test -d auth_migration -v ON_ERROR_STOP=1 < tests/auth-db-smoke.sql
          COUNT=$(docker run --rm --network host -e PGPASSWORD=disposable_only postgres:16 psql -h 127.0.0.1 -U migration_test -d auth_migration -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
          test "$COUNT" = '5'
          test "$(docker run --rm --network host -e PGPASSWORD=disposable_only postgres:16 psql -h 127.0.0.1 -U migration_test -d auth_migration -tAc "SELECT COUNT(*) FROM information_schema.columns WHERE table_name='users' AND column_name='google_sub'")" = '1'
          test "$(docker run --rm --network host -e PGPASSWORD=disposable_only postgres:16 psql -h 127.0.0.1 -U migration_test -d auth_migration -tAc "SELECT COUNT(*) FROM pg_constraint WHERE conname='users_google_sub_unique'")" = '1'
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Commit generated migration only
        run: |
          git add -- db/migrations
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(db): add unique Google OIDC subject to users"
          git push origin HEAD:integration/t1-t12
