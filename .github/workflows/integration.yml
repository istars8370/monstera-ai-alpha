name: Alpha integration checks
on:
  push:
    branches: [integration/t1-t12]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      # 잠금 파일이 package.json과 일치하지 않으면 즉시 실패한다.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  database-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integration_user
          POSTGRES_PASSWORD: ephemeral_only
          POSTGRES_DB: monstera_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration_user -d monstera_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert Drizzle migration matches current schema
        run: |
          pnpm exec drizzle-kit generate --config=drizzle.config.ts
          test -z "$(git status --porcelain -- db/migrations)"
      - name: Apply SQL and check isolated credit ledger invariants
        run: |
          set -eu
          for migration in db/migrations/*.sql; do
            docker run --rm -i --network host -e PGPASSWORD=ephemeral_only postgres:16 psql -h 127.0.0.1 -U integration_user -d monstera_integration -v ON_ERROR_STOP=1 < "$migration"
          done
          docker run --rm -i --network host -e PGPASSWORD=ephemeral_only postgres:16 psql -h 127.0.0.1 -U integration_user -d monstera_integration -v ON_ERROR_STOP=1 < tests/db-smoke.sql
          docker run --rm -i --network host -e PGPASSWORD=ephemeral_only postgres:16 psql -h 127.0.0.1 -U integration_user -d monstera_integration -v ON_ERROR_STOP=1 < tests/auth-db-smoke.sql
      - name: Assert concurrent holds cannot reserve beyond balance
        run: |
          set -eu
          PSQL='docker run --rm --network host -e PGPASSWORD=ephemeral_only postgres:16 psql -h 127.0.0.1 -U integration_user -d monstera_integration -v ON_ERROR_STOP=1'
          $PSQL -c "INSERT INTO users(email) VALUES ('concurrent-test@example.invalid');"
          $PSQL -c "INSERT INTO credits(user_id, balance) SELECT id, 100 FROM users WHERE email='concurrent-test@example.invalid';"
          SQL="BEGIN; UPDATE credits SET reserved=reserved+80 WHERE user_id=(SELECT id FROM users WHERE email='concurrent-test@example.invalid') AND balance-reserved>=80; SELECT pg_sleep(1); COMMIT;"
          $PSQL -c "$SQL" > /tmp/hold-a.log &
          A=$!
          $PSQL -c "$SQL" > /tmp/hold-b.log &
          B=$!
          wait "$A"
          wait "$B"
          RESERVED=$($PSQL -tAc "SELECT reserved FROM credits WHERE user_id=(SELECT id FROM users WHERE email='concurrent-test@example.invalid');")
          test "$RESERVED" = '80'
