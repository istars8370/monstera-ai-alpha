name: Alpha integration checks
on:
  push:
    branches: [integration/t1-t12]
  pull_request:
    branches: [integration/t1-t12]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      # 잠금 파일이 package.json과 일치하지 않으면 즉시 실패한다.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  database-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integration_user
          POSTGRES_PASSWORD: ephemeral_only
          POSTGRES_DB: monstera_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration_user -d monstera_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert Drizzle migration matches current schema
        run: |
          pnpm exec drizzle-kit generate --config=drizzle.config.ts
          test -z "$(git status --porcelain -- db/migrations)"
      - name: Apply SQL and check isolated credit ledger invariants
        run: |
          set -eu
          for migration in db/migrations/*.sql; do
            docker run --rm -i --network host -e PGPASSWORD=ephemeral_only postgres:16 psql -h 127.0.0.1 -U integration_user -d monstera_integration -v ON_ERROR_STOP=1 < "$migration"
          done
          docker run --rm -i --network host -e PGPASSWORD=ephemeral_only postgres:16 psql -h 127.0.0.1 -U integration_user -d monstera_integration -v ON_ERROR_STOP=1 < tests/db-smoke.sql
          docker run --rm -i --network host -e PGPASSWORD=ephemeral_only postgres:16 psql -h 127.0.0.1 -U integration_user -d monstera_integration -v ON_ERROR_STOP=1 < tests/auth-db-smoke.sql
          docker run --rm -i --network host -e PGPASSWORD=ephemeral_only postgres:16 psql -h 127.0.0.1 -U integration_user -d monstera_integration -v ON_ERROR_STOP=1 < tests/studio-db-smoke.sql
      - name: Assert concurrent holds cannot reserve beyond balance
        run: |
          set -eu
          PSQL='docker run --rm --network host -e PGPASSWORD=ephemeral_only postgres:16 psql -h 127.0.0.1 -U integration_user -d monstera_integration -v ON_ERROR_STOP=1'
          $PSQL -c "INSERT INTO users(email) VALUES ('concurrent-test@example.invalid');"
          $PSQL -c "INSERT INTO credits(user_id, balance) SELECT id, 100 FROM users WHERE email='concurrent-test@example.invalid';"
          SQL="BEGIN; UPDATE credits SET reserved=reserved+80 WHERE user_id=(SELECT id FROM users WHERE email='concurrent-test@example.invalid') AND balance-reserved>=80; SELECT pg_sleep(1); COMMIT;"
          $PSQL -c "$SQL" > /tmp/hold-a.log &
          A=$!
          $PSQL -c "$SQL" > /tmp/hold-b.log &
          B=$!
          wait "$A"
          wait "$B"
          RESERVED=$($PSQL -tAc "SELECT reserved FROM credits WHERE user_id=(SELECT id FROM users WHERE email='concurrent-test@example.invalid');")
          test "$RESERVED" = '80'

      - name: Validate disposable PostgreSQL backup and restore
        run: |
          set -euo pipefail
          # Only the Docker service created for this CI job is ever backed up.
          # This test never receives Neon or production database credentials.
          docker run --rm --network host -e PGPASSWORD=ephemeral_only postgres:16 \
            pg_dump -h 127.0.0.1 -U integration_user -d monstera_integration \
              --no-owner --no-privileges --format=plain > /tmp/monstera-disposable-backup.sql
          docker run --rm --network host -e PGPASSWORD=ephemeral_only postgres:16 \
            psql -h 127.0.0.1 -U integration_user -d postgres -v ON_ERROR_STOP=1 \
              -c 'CREATE DATABASE monstera_disposable_restore'
          docker run --rm -i --network host -e PGPASSWORD=ephemeral_only postgres:16 \
            psql -h 127.0.0.1 -U integration_user -d monstera_disposable_restore \
              -v ON_ERROR_STOP=1 < /tmp/monstera-disposable-backup.sql
          docker run --rm --network host -e PGPASSWORD=ephemeral_only postgres:16 \
            psql -h 127.0.0.1 -U integration_user -d monstera_disposable_restore \
              -v ON_ERROR_STOP=1 -tAc \
              "SELECT CASE WHEN
                 (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE') = 9
                 AND (SELECT balance=80 AND reserved=0 FROM credits c JOIN users u ON u.id=c.user_id WHERE u.email='ledger-test@example.invalid')
                 AND (SELECT reserved=80 FROM credits c JOIN users u ON u.id=c.user_id WHERE u.email='concurrent-test@example.invalid')
                 AND (SELECT COUNT(*) FROM usage_ledger WHERE idem_key='request-1' AND status='settled') = 1
                 AND (SELECT COUNT(*) FROM pg_constraint WHERE conname='users_google_sub_unique') = 1
              THEN 'RESTORE_OK' ELSE 'RESTORE_FAILED' END" | grep -qx 'RESTORE_OK'


  http-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ALPHA_BASIC_USER: ci-alpha
      ALPHA_BASIC_PASSWORD: ci-only-alpha-password-not-a-real-secret
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-placeholder-not-a-secret
      MONSTERA_PUBLIC_ORIGIN: http://127.0.0.1:3307
      MONSTERA_TEST_HTTP_ORIGIN: http://127.0.0.1:3307
      MONSTERA_SESSION_SECRET: ci-only-signing-key-do-not-use-for-real-sessions
      MONSTERA_FREE_CHAT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Real HTTP smoke tests (no DB, Google or provider network calls)
        run: |
          set -euo pipefail
          pnpm exec next start --hostname 127.0.0.1 --port 3307 > /tmp/monstera-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3307/api/health > /dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/monstera-http.log; exit 1; fi
          timeout 45s node --test tests/http-smoke.mjs

  redis-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test atomic Lua request caps without Upstash credentials
        run: node --experimental-transform-types --test tests/redis-smoke.mjs


  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      ALPHA_BASIC_USER: ci-alpha
      ALPHA_BASIC_PASSWORD: ci-only-alpha-password-not-a-real-secret
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-placeholder-not-a-secret
      MONSTERA_PUBLIC_ORIGIN: http://127.0.0.1:3307
      MONSTERA_TEST_HTTP_ORIGIN: http://127.0.0.1:3307
      MONSTERA_SESSION_SECRET: ci-only-signing-key-do-not-use-for-real-sessions
      MONSTERA_FREE_CHAT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated Chromium headless shell
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm build
      - name: Exercise real browser and mocked external API boundaries
        run: |
          set -euo pipefail
          pnpm exec next start --hostname 127.0.0.1 --port 3307 > /tmp/monstera-browser.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:3307/api/health > /dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/monstera-browser.log; exit 1; fi
          pnpm exec playwright test --config=playwright.config.mjs
      - name: Retain failing browser traces only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monstera-browser-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3


  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build release image using the pinned pnpm lockfile
        run: docker build -t monstera-integration:ci .
      - name: Verify private alpha routes in isolated container
        run: |
          set -euo pipefail
          docker run -d --rm --name monstera-integration-ci -p 4307:3000 \
            -e ALPHA_BASIC_USER=ci-alpha \
            -e ALPHA_BASIC_PASSWORD=ci-only-alpha-password-not-a-real-secret \
            -e MONSTERA_SESSION_SECRET=ci-only-signing-key-do-not-use-for-real-sessions \
            monstera-integration:ci
          trap 'docker rm -f monstera-integration-ci >/dev/null 2>&1 || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4307/api/health >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then docker logs monstera-integration-ci; exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4307/)" = '401'
          test "$(curl -s -o /dev/null -w '%{http_code}' -u 'ci-alpha:ci-only-alpha-password-not-a-real-secret' http://127.0.0.1:4307/)" = '200'
          test "$(curl -s -o /dev/null -w '%{http_code}' -u 'ci-alpha:ci-only-alpha-password-not-a-real-secret' http://127.0.0.1:4307/api/models)" = '401'
