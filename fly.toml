# 앱 이름은 fly launch 후 실제 이름으로 변경한다.
app = "monstera-ai-alpha-placeholder"
primary_region = "nrt"
[env]
  NODE_ENV = "production"
  PORT = "3000"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
